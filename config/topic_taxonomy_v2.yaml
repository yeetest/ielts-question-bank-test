primary_selection_policy:
  description: "Temporary deterministic inference policy for derived view only."
  l2:
    rule: "if multiple l2 exist, choose first valid l2 by priority order"
    priority_source: "l1_to_l2 order for selected l1"
  l3:
    rule: "if multiple l3 exist, prefer first l3 belonging to chosen primary l2"
    fallback: "if none match cleanly, set primary.l3 to null and keep all in secondary"
  notes:
    - "This is a temporary derivation policy, not final classification truth."
    - "No LLM and no retraining in this phase."

