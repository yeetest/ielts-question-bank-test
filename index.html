<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IELTS Speaking Question Bank — 2026 Jan–Apr</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components/cards.css">
  <link rel="stylesheet" href="css/components/modal.css">
  <link rel="stylesheet" href="css/components/tags.css">
  <link rel="stylesheet" href="css/components/sidebar.css">

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-JY0Q99M0XR"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-JY0Q99M0XR');
  </script>
</head>
<body>

<h1>IELTS Speaking Question Bank</h1>
<div class="subtitle">2026 Jan–Apr season · <span id="total-count"></span></div>

<div class="tabs">
  <button class="tab" id="tab-part1">Part 1</button>
  <button class="tab" id="tab-part2">Part 2 + Part 3</button>
  <button class="tab" id="sidebar-toggle">◀ 收起筛选</button>
</div>

<div id="main-layout">
  <!-- Sidebar mounts here -->
  <div id="sidebar-root"></div>
  
  <!-- Card grid — JS renders cards into this container -->
  <div class="grid" id="grid"></div>
</div>

<!-- Modal overlay — JS fills #modal-content when user clicks a card or tag -->
<div class="overlay" id="overlay">
  <div class="modal" id="modal">
    <button class="close-btn" id="close-btn">✕</button>
    <div id="modal-content"></div>
  </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
