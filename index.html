<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>IELTS Speaking Question Bank — 2026 Jan–Apr</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Georgia', serif;
    background: #f7f5f0;
    color: #222;
    padding: 24px;
  }
  h1 {
    font-size: 1.4rem;
    font-weight: bold;
    margin-bottom: 6px;
  }
  .subtitle {
    color: #888;
    font-size: 0.85rem;
    margin-bottom: 20px;
  }
  .tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
  }
  .tab {
    padding: 8px 20px;
    border: 1.5px solid #ccc;
    border-radius: 4px;
    cursor: pointer;
    background: #fff;
    font-size: 0.9rem;
  }
  .tab.active {
    background: #222;
    color: #fff;
    border-color: #222;
  }

  .legend {
    display: flex;
    gap: 16px;
    margin-bottom: 16px;
    font-size: 0.8rem;
    align-items: center;
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 4px; }
  .dot-tz { background: #3b82f6; }
  .dot-lk { background: #f59e0b; }
  .dot-both { background: #10b981; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 14px;
  }

  .card {
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 24px; 
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  .card:hover { 
    transform: translateY(-6px); 
    box-shadow: 0 10px 20px rgba(0,0,0,0.12); 
    border-color: #bbb;
  }

  .card-title {
    font-size: 0.95rem;
    font-weight: bold;
    margin-bottom: 6px;
  }
  .card-meta {
    font-size: 0.75rem;
    color: #888;
  }
  .source-bar {
    display: flex;
    gap: 4px;
    margin-top: 8px;
  }
  .badge {
    font-size: 0.7rem;
    padding: 2px 7px;
    border-radius: 10px;
    font-weight: bold;
  }
  .badge-tz { background: #dbeafe; color: #1d4ed8; }
  .badge-lk { background: #fef3c7; color: #b45309; }
  .badge-unmatched { background: #f3f4f6; color: #6b7280; }

  .overlay {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.4);
    z-index: 100;
    justify-content: center;
    align-items: flex-start;
    padding: 40px 16px;
    overflow-y: auto;
  }
  .overlay.open { display: flex; }
  .modal {
    background: #fff;
    border-radius: 8px;
    padding: 28px;
    max-width: 620px;
    width: 100%;
    position: relative;
  }
  .modal h2 {
    font-size: 1.2rem;
    margin-bottom: 4px;
  }
  .modal .season {
    font-size: 0.78rem;
    color: #999;
    margin-bottom: 16px;
  }
  .close-btn {
    position: absolute;
    top: 14px; right: 16px;
    font-size: 1.2rem;
    cursor: pointer;
    background: none;
    border: none;
    color: #555;
  }
  
  /* BACK BUTTON STYLE */
  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 0.8rem;
    color: #6366f1;
    cursor: pointer;
    margin-bottom: 12px;
    font-weight: bold;
    background: #f0f7ff;
    padding: 4px 8px;
    border-radius: 4px;
    border: 1px solid #d0e7ff;
  }
  .back-btn:hover { background: #e0f0ff; }

  .section-label {
    font-size: 0.78rem;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #999;
    margin: 14px 0 6px;
  }
  .q-row {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    padding: 5px 0;
    border-bottom: 1px solid #f0f0f0;
    font-size: 0.88rem;
    line-height: 1.5;
  }
  .q-row:last-child { border-bottom: none; }
  .q-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
    margin-top: 6px;
  }
  .q-dot.tz { background: #3b82f6; }
  .q-dot.lk { background: #f59e0b; }

  .cue-card {
    background: #f9fafb;
    border-left: 3px solid #6366f1;
    padding: 12px 14px;
    border-radius: 4px;
    font-size: 0.88rem;
    line-height: 1.6;
    margin-bottom: 6px;
  }
  .cue-card .prompt { font-weight: bold; margin-bottom: 8px; }
  .cue-card ul { padding-left: 16px; }
  .cue-card li { margin-bottom: 2px; }

  /* UPDATED CTAG WITH SCALE EFFECT */
  .ctag {
    font-size: 0.68rem;
    padding: 2px 7px;
    border-radius: 10px;
    font-weight: 600;
    white-space: nowrap;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    display: inline-block;
  }
  .ctag:hover { 
    transform: scale(1.1); /* Gets slightly bigger */
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    filter: brightness(0.95);
  }

  .ctag-people             { background: #fce7f3; color: #9d174d; }
  .ctag-experience-activity { background: #d1fae5; color: #065f46; }
  .ctag-place              { background: #e0f2fe; color: #075985; }
  .ctag-object             { background: #f3f4f6; color: #374151; }
  .ctag-tag                { background: #ede9fe; color: #5b21b6; }

  .summary-item {
    cursor: pointer;
    padding: 8px 0;
    border-bottom: 1px solid #eee;
    color: #444;
    transition: padding-left 0.2s;
  }
  .summary-item:hover { color: #6366f1; padding-left: 5px; }
  .summary-item:last-child { border-bottom: none; }

  .type-tags { display: inline-flex; gap: 4px; flex-wrap: wrap; margin-left: 6px; vertical-align: middle; }
  .ttag {
    font-size: 0.65rem;
    padding: 1px 6px;
    border-radius: 8px;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    white-space: nowrap;
  }
  .ttag-describe  { background: #dbeafe; color: #1e40af; }
  .ttag-analyze   { background: #d1fae5; color: #065f46; }
  .ttag-evaluate  { background: #fef3c7; color: #92400e; }
  .ttag-predict   { background: #ede9fe; color: #5b21b6; }
  .ttag-unclear   { background: #f3f4f6; color: #6b7280; }
</style>
</head>
<body>

<h1>IELTS Speaking Question Bank</h1>
<div class="subtitle">2026 Jan–Apr season · <span id="total-count"></span></div>

<div class="tabs">
  <button class="tab active" onclick="switchTab('part1')">Part 1</button>
  <button class="tab" onclick="switchTab('part2')">Part 2 + Part 3</button>
</div>

<div class="legend">
  <span><span class="dot dot-tz"></span>同桌英语</span>
  <span><span class="dot dot-lk"></span>老烤鸭</span>
  <span><span class="dot dot-both"></span>Both sources</span>
</div>

<div class="grid" id="grid"></div>

<div class="overlay" id="overlay" onclick="closeModal(event)">
  <div class="modal" id="modal">
    <button class="close-btn" onclick="closeOverlay()">✕</button>
    <div id="modal-content"></div>
  </div>
</div>

<script>
let part1Data = [], part2Data = [];
let currentTab = 'part1';
let lastActiveTag = null; // Tracks navigation history

function renderTypeTags(tags) {
  if (!tags || !tags.length) return '';
  return `<span class="type-tags">${tags.map(t => `<span class="ttag ttag-${t}">${t}</span>`).join('')}</span>`;
}

function getSources(questions) {
  return {
    hasTZ: questions.some(q => q.source === 'tongzhuo'),
    hasLK: questions.some(q => q.source === 'laokaoya')
  };
}

function renderGrid(tab) {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  const data = tab === 'part1' ? part1Data : part2Data;
  document.getElementById('total-count').textContent = `${data.length} topics · Part ${tab === 'part1' ? '1' : '2'}`;

  data.forEach((item, idx) => {
    const questions = item.questions || item.part3 || [];
    const { hasTZ, hasLK } = getSources(questions);
    const card = document.createElement('div');
    card.className = 'card';
    card.onclick = () => { lastActiveTag = null; openModal(tab, idx); };

    let title = tab === 'part1' ? item.topic_en : (item.cue_card?.prompt || item.topic || '').replace(/[\u200b\u200c\u200d\ufeff]/g, '').replace(/\s*You should say.*/is, '').replace(/^\s*Describe\s+/i, '').trim();
    if (title.length > 80) title = title.slice(0, 79) + '…';

    const ct = item.content_tags || [];
    const ctBadges = tab === 'part2' && ct.length ? `
      <div class="source-bar" style="margin-top:6px;flex-wrap:wrap;gap:4px;">
        ${ct.map((tag, i) => `<span class="ctag ${i === 0 ? `ctag-${tag.replace('/', '-')}` : 'ctag-tag'}" onclick="event.stopPropagation(); openTagSummary('${tag}')">${tag}</span>`).join('')}
      </div>` : '';

    card.innerHTML = `
      <div class="card-title">${title}</div>
      <div class="card-meta">${questions.length} question${questions.length !== 1 ? 's' : ''}</div>
      <div class="source-bar">
        ${hasTZ ? '<span class="badge badge-tz">同桌</span>' : ''}
        ${hasLK ? '<span class="badge badge-lk">老烤鸭</span>' : ''}
      </div>
      ${ctBadges}
    `;
    grid.appendChild(card);
  });
}

function openTagSummary(tagName) {
  lastActiveTag = tagName;
  const content = document.getElementById('modal-content');
  const filtered = part2Data.filter(item => item.content_tags && item.content_tags.includes(tagName));

  content.innerHTML = `
    <h2>Topics tagged: ${tagName}</h2>
    <div class="season">${filtered.length} matches found</div>
    <div class="cue-card">
      <div class="prompt">Questions in this category:</div>
      <div style="margin-top:10px">
        ${filtered.map(item => `<div class="summary-item" onclick="openModal('part2', ${part2Data.indexOf(item)})">${item.topic || item.topic_en || 'View Topic'}</div>`).join('')}
      </div>
    </div>
  `;
  document.getElementById('overlay').classList.add('open');
}

function openModal(tab, idx) {
  const item = tab === 'part1' ? part1Data[idx] : part2Data[idx];
  const content = document.getElementById('modal-content');
  
  // Add Back Button if we came from a tag summary
  const backBtn = lastActiveTag ? `<div class="back-btn" onclick="openTagSummary('${lastActiveTag}')">← Back to ${lastActiveTag}</div>` : '';

  if (tab === 'part1') {
    const tzQs = item.questions.filter(q => q.source === 'tongzhuo');
    const lkQs = item.questions.filter(q => q.source === 'laokaoya');
    content.innerHTML = `
      ${backBtn}
      <h2>${item.topic_en}</h2>
      <div class="season">${item.season} · Part 1</div>
      ${tzQs.map(q => `<div class="q-row"><span class="q-dot tz"></span><span>${q.text}</span></div>`).join('')}
      ${lkQs.map(q => `<div class="q-row"><span class="q-dot lk"></span><span>${q.text}</span></div>`).join('')}
    `;
  } else {
    const cc = item.cue_card || {};
    const p3 = item.part3 || [];
    const ccPrompt = (cc.prompt || '').replace(/\s*You should say.*/is, '').trim();
    const ccBullets = (cc.you_should_say || []).filter(s => s && !/^you should say/i.test(s));

    content.innerHTML = `
      ${backBtn}
      <h2>${item.topic || item.topic_en || ''}</h2>
      <div class="season">${item.season} · Part 2 + 3</div>
      <div class="section-label">Cue Card</div>
      <div class="cue-card">
        <div class="prompt">${ccPrompt}</div>
        <ul>${ccBullets.map(s => `<li>${s}</li>`).join('')}</ul>
      </div>
      <div class="section-label">Part 3 Questions</div>
      ${p3.map(q => `<div class="q-row"><span class="q-dot ${q.source === 'tongzhuo' ? 'tz' : 'lk'}"></span><span>${q.text}${renderTypeTags(q.type_tags)}</span></div>`).join('')}
    `;
  }
  document.getElementById('overlay').classList.add('open');
}

function closeOverlay() { document.getElementById('overlay').classList.remove('open'); }
function closeModal(e) { if (e.target === document.getElementById('overlay')) closeOverlay(); }
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', (i === 0 && tab === 'part1') || (i === 1 && tab === 'part2')));
  renderGrid(tab);
}

(async () => {
  [part1Data, part2Data] = await Promise.all([
    fetch('merged_part1.json').then(r => r.json()),
    fetch('merged_part2.json').then(r => r.json()),
  ]);
  renderGrid('part1');
})();
</script>
</body>
</html>
