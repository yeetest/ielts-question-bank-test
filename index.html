<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>IELTS Speaking Question Bank — 2026 Jan–Apr</title>

<!-- ============================================================
     SECTION 1: STYLE — appearance only
     Everything here is purely visual: colors, spacing, fonts,
     hover effects, layout. No logic lives here.
     ============================================================ -->
<style>
  /* ---------- Reset & Base ---------- */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Georgia', serif;
    background: #f7f5f0;
    color: #222;
    padding: 24px;
  }
  h1 {
    font-size: 1.4rem;
    font-weight: bold;
    margin-bottom: 6px;
  }
  .subtitle {
    color: #888;
    font-size: 0.85rem;
    margin-bottom: 20px;
  }

  /* ---------- Tabs ---------- */
  .tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
  }
  .tab {
    padding: 8px 20px;
    border: 1.5px solid #ccc;
    border-radius: 4px;
    cursor: pointer;
    background: #fff;
    font-size: 0.9rem;
  }
  .tab.active {
    background: #222;
    color: #fff;
    border-color: #222;
  }

  /* ---------- Card Grid ---------- */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 14px;
  }
  .card {
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 24px;
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .card:hover {
    transform: translateY(-6px);
    box-shadow: 0 10px 20px rgba(0,0,0,0.12);
    border-color: #bbb;
  }
  .card-title {
    font-size: 0.95rem;
    font-weight: bold;
    margin-bottom: 6px;
  }
  .card-meta {
    font-size: 0.75rem;
    color: #888;
  }

  /* ---------- Overlay & Modal ---------- */
  .overlay {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.4);
    z-index: 100;
    justify-content: center;
    align-items: flex-start;
    padding: 40px 16px;
    overflow-y: auto;
  }
  .overlay.open { display: flex; }
  .modal {
    background: #fff;
    border-radius: 8px;
    padding: 28px;
    max-width: 620px;
    width: 100%;
    position: relative;
  }
  .modal h2 {
    font-size: 1.2rem;
    margin-bottom: 4px;
  }
  .close-btn {
    position: absolute;
    top: 14px; right: 16px;
    font-size: 1.2rem;
    cursor: pointer;
    background: none;
    border: none;
    color: #555;
  }
  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 0.8rem;
    color: #6366f1;
    cursor: pointer;
    margin-bottom: 12px;
    font-weight: bold;
    background: #f0f7ff;
    padding: 4px 8px;
    border-radius: 4px;
    border: 1px solid #d0e7ff;
  }
  .back-btn:hover { background: #e0f0ff; }

  /* ---------- Modal Content ---------- */
  .section-label {
    font-size: 0.78rem;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #999;
    margin: 14px 0 6px;
  }
  .q-row {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    padding: 5px 0;
    border-bottom: 1px solid #f0f0f0;
    font-size: 0.88rem;
    line-height: 1.5;
  }
  .q-row:last-child { border-bottom: none; }
  .cue-card {
    background: #f9fafb;
    border-left: 3px solid #6366f1;
    padding: 12px 14px;
    border-radius: 4px;
    font-size: 0.88rem;
    line-height: 1.6;
    margin-bottom: 6px;
  }
  .cue-card .prompt { font-weight: bold; margin-bottom: 8px; }
  .summary-item {
    cursor: pointer;
    padding: 8px 0;
    border-bottom: 1px solid #eee;
    color: #444;
  }
  .summary-item:hover { color: #6366f1; text-decoration: underline; }

  /* ---------- Content Tags (topic-level) ---------- */
  /* First tag = category (people/place/object/experience/activity) */
  /* Remaining tags = semantic tags */
  .tag-row {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-top: 6px;
  }
  .ctag {
    font-size: 0.68rem;
    padding: 2px 7px;
    border-radius: 10px;
    font-weight: 600;
    white-space: nowrap;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    display: inline-block;
  }
  .ctag:hover {
    transform: scale(1.1);
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
  }
  /* Category tag colors — one per category type */
  .ctag-people              { background: #fce7f3; color: #9d174d; }
  .ctag-experience-activity { background: #d1fae5; color: #065f46; }
  .ctag-place               { background: #e0f2fe; color: #075985; }
  .ctag-object              { background: #f3f4f6; color: #374151; }
  /* Semantic tags (index 1+) all share one neutral style */
  .ctag-tag                 { background: #ede9fe; color: #5b21b6; }

  /* ---------- Question Type Tags (per Part 3 question) ---------- */
  .type-tags {
    display: inline-flex;
    gap: 4px;
    flex-wrap: wrap;
    margin-left: 6px;
    vertical-align: middle;
  }
  .ttag {
    font-size: 0.65rem;
    padding: 1px 6px;
    border-radius: 8px;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    white-space: nowrap;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    display: inline-block;
  }
  .ttag:hover {
    transform: scale(1.1);
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    filter: brightness(0.95);
  }
  /* Part 2 type tags */
  .ttag-describe { background: #dbeafe; color: #1e40af; }
  .ttag-analyze  { background: #d1fae5; color: #065f46; }
  .ttag-evaluate { background: #fef3c7; color: #92400e; }
  .ttag-predict  { background: #ede9fe; color: #5b21b6; }
  .ttag-unclear  { background: #f3f4f6; color: #6b7280; }
  /* Part 1 type tags */
  .ttag-experience   { background: #fed7aa; color: #9a3412; }
  .ttag-frequency    { background: #cffafe; color: #155e75; }
  .ttag-description  { background: #dbeafe; color: #1e40af; }
  .ttag-preference   { background: #fce7f3; color: #9d174d; }
  .ttag-evaluation   { background: #fef3c7; color: #92400e; }
  .ttag-comparison   { background: #dcfce7; color: #166534; }
  .ttag-hypothetical { background: #ede9fe; color: #5b21b6; }
</style>
</head>

<!-- ============================================================
     SECTION 2: BODY — skeleton only
     Only structural containers live here. No onclick attributes,
     no data, no logic. JS wires up all interactions after load.
     ============================================================ -->
<body>

<h1>IELTS Speaking Question Bank</h1>
<div class="subtitle">2026 Jan–Apr season · <span id="total-count"></span></div>

<div class="tabs">
  <button class="tab" id="tab-part1">Part 1</button>
  <button class="tab" id="tab-part2">Part 2 + Part 3</button>
</div>

<!-- Card grid — JS renders cards into this container -->
<div class="grid" id="grid"></div>

<!-- Modal overlay — JS fills #modal-content when user clicks a card or tag -->
<div class="overlay" id="overlay">
  <div class="modal" id="modal">
    <button class="close-btn" id="close-btn">✕</button>
    <div id="modal-content"></div>
  </div>
</div>

<!-- ============================================================
     SECTION 3: SCRIPT — all logic
     Organized into:
       A. State
       B. Data loading
       C. Rendering helpers
       D. Grid rendering
       E. Modal: topic detail
       F. Modal: tag summary
       G. Modal: question type summary
       H. Event wiring (runs on DOMContentLoaded)
     ============================================================ -->
<script>

/* ----------------------------------------------------------
   A. STATE
   Central state object — single source of truth for the app.
   ---------------------------------------------------------- */
const state = {
  part1Data: [],      // array of Part 1 topic objects from merged_part1.json
  part2Data: [],      // array of Part 2+3 topic objects from merged_part2.json
  currentTab: 'part1',
  lastActiveTag: null // remembers which tag was open so Back button works
};


/* ----------------------------------------------------------
   B. DATA LOADING
   Fetches both JSON files in parallel on page load.
   ---------------------------------------------------------- */
async function loadData() {
  [state.part1Data, state.part2Data] = await Promise.all([
    fetch('merged_part1.json').then(r => r.json()),
    fetch('merged_part2.json').then(r => r.json()),
  ]);
  renderGrid('part1');
}


/* ----------------------------------------------------------
   C. RENDERING HELPERS
   Small pure functions that return HTML strings.
   Each does one thing only.
   ---------------------------------------------------------- */

// Builds the colored question-type tag badges (describe / analyze / evaluate / predict)
// shown next to each Part 3 question.
function renderTypeTags(tags) {
  if (!tags || !tags.length) return '';
  return `<span class="type-tags">
    ${tags.map(t =>
      `<span class="ttag ttag-${t}" data-type-tag="${t}">${t}</span>`
    ).join('')}
  </span>`;
}

// Builds the content tag row shown on each Part 2 card.
// First tag gets a category color class; the rest get the neutral .ctag-tag style.
function renderContentTags(tags) {
  if (!tags || !tags.length) return '';
  const badges = tags.map((tag, i) => {
    const colorClass = i === 0
      ? `ctag-${tag.replace('/', '-')}`  // e.g. ctag-experience-activity
      : 'ctag-tag';                       // all semantic tags use neutral purple
    return `<span class="ctag ${colorClass}" data-content-tag="${tag}">${tag}</span>`;
  }).join('');
  return `<div class="tag-row">${badges}</div>`;
}

// Cleans up Part 2 cue card prompts: removes "Describe", "You should say...", zero-width chars.
function cleanTitle(raw) {
  return (raw || '')
    .replace(/[\u200b\u200c\u200d\ufeff]/g, '')
    .replace(/\s*You should say.*/is, '')
    .replace(/^\s*Describe\s+/i, '')
    .trim();
}


/* ----------------------------------------------------------
   D. GRID RENDERING
   Builds all topic cards and injects them into #grid.
   Called when switching tabs.
   ---------------------------------------------------------- */
function renderGrid(tab) {
  state.currentTab = tab;

  // Update tab button active state
  document.getElementById('tab-part1').classList.toggle('active', tab === 'part1');
  document.getElementById('tab-part2').classList.toggle('active', tab === 'part2');

  const grid = document.getElementById('grid');
  grid.innerHTML = '';

  const data = tab === 'part1' ? state.part1Data : state.part2Data;
  document.getElementById('total-count').textContent =
    `${data.length} topics · Part ${tab === 'part1' ? '1' : '2'}`;

  data.forEach((item, idx) => {
    const questions = item.questions || item.part3 || [];

    // Truncate long titles to 80 chars
    let title = tab === 'part1'
      ? item.topic_en
      : cleanTitle(item.cue_card?.prompt || item.topic || '');
    if (title.length > 80) title = title.slice(0, 79) + '…';

    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.idx = idx;   // store index so click handler knows which topic to open
    card.dataset.tab = tab;

    card.innerHTML = `
      <div class="card-title">${title}</div>
      <div class="card-meta">${questions.length} questions</div>
      ${renderContentTags(item.content_tags)}
    `;

    grid.appendChild(card);
  });
}


/* ----------------------------------------------------------
   E. MODAL: TOPIC DETAIL
   Opens when a card is clicked. Shows cue card + Part 3
   questions (Part 2), or question list (Part 1).
   ---------------------------------------------------------- */
function openModal(tab, idx) {
  const item = tab === 'part1' ? state.part1Data[idx] : state.part2Data[idx];
  const backBtn = state.lastActiveTag
    ? `<div class="back-btn" id="back-btn">← Back to ${state.lastActiveTag}</div>`
    : '';

  let html = '';

  if (tab === 'part1') {
    html = `
      ${backBtn}
      <h2>${item.topic_en}</h2>
      <div class="section-label">${item.season} · Part 1</div>
      ${renderContentTags(item.content_tags)}
      <div class="section-label" style="margin-top:14px">Questions</div>
      ${item.questions.map(q => `
        <div class="q-row"><span>${q.text}${renderTypeTags(q.type_tags)}</span></div>
      `).join('')}
    `;
  } else {
    const cc = item.cue_card || {};
    const p3 = item.part3 || [];
    html = `
      ${backBtn}
      <h2>${item.topic || item.topic_en || ''}</h2>
      <div class="section-label">${item.season} · Part 2 + 3</div>
      <div class="section-label">Cue Card</div>
      <div class="cue-card">
        <div class="prompt">${cleanTitle(cc.prompt || '')}</div>
        <ul>
          ${(cc.you_should_say || [])
            .filter(s => s && !/^you should say/i.test(s))
            .map(s => `<li>${s}</li>`)
            .join('')}
        </ul>
      </div>
      <div class="section-label">Part 3 Questions</div>
      ${p3.map(q => `
        <div class="q-row">
          <span>${q.text}${renderTypeTags(q.type_tags)}</span>
        </div>
      `).join('')}
    `;
  }

  document.getElementById('modal-content').innerHTML = html;
  openOverlay();

  // Wire up back button if present
  const back = document.getElementById('back-btn');
  if (back) back.addEventListener('click', () => openTagSummary(state.lastActiveTag));
}


/* ----------------------------------------------------------
   F. MODAL: TAG SUMMARY
   Opens when a content tag is clicked (e.g. "music").
   Shows all Part 2 topics that share that tag.
   ---------------------------------------------------------- */
function openTagSummary(tagName) {
  state.lastActiveTag = tagName;

  const matches = [];
  state.part1Data.forEach((item, idx) => {
    if (item.content_tags && item.content_tags.includes(tagName))
      matches.push({ label: item.topic_en, idx, tab: 'part1' });
  });
  state.part2Data.forEach((item, idx) => {
    if (item.content_tags && item.content_tags.includes(tagName))
      matches.push({ label: item.topic || item.topic_en, idx, tab: 'part2' });
  });

  const items = matches.map(m =>
    `<div class="summary-item" data-modal-idx="${m.idx}" data-modal-tab="${m.tab}">
      <span style="font-size:0.7rem;color:#aaa;margin-right:4px">Part ${m.tab === 'part1' ? '1' : '2'}</span>${m.label}
    </div>`
  ).join('');

  document.getElementById('modal-content').innerHTML = `
    <h2>Topics tagged: ${tagName}</h2>
    <div class="section-label">${matches.length} matches</div>
    <div class="cue-card">
      <div class="prompt">Topics in this category:</div>
      <div style="margin-top:10px">${items}</div>
    </div>
  `;
  openOverlay();
}


/* ----------------------------------------------------------
   G. MODAL: QUESTION TYPE SUMMARY
   Opens when a type tag is clicked (describe / analyze / etc).
   Shows all Part 3 questions across all topics with that type.
   ---------------------------------------------------------- */
function openTypeSummary(typeName) {
  const results = [];
  state.part1Data.forEach(topic => {
    (topic.questions || [])
      .filter(q => q.type_tags && q.type_tags.includes(typeName))
      .forEach(q => results.push({ topicTitle: topic.topic_en, text: q.text, part: 1 }));
  });
  state.part2Data.forEach(topic => {
    (topic.part3 || [])
      .filter(q => q.type_tags && q.type_tags.includes(typeName))
      .forEach(q => results.push({ topicTitle: topic.topic || topic.topic_en, text: q.text, part: 2 }));
  });

  const rows = results.map(res => `
    <div style="margin-bottom:12px; border-bottom:1px solid #eee; padding-bottom:8px;">
      <div style="font-weight:bold; color:#6366f1; font-size:0.75rem;">Part ${res.part} · ${res.topicTitle}</div>
      <div>${res.text}</div>
    </div>
  `).join('');

  document.getElementById('modal-content').innerHTML = `
    <h2>Question Type: ${typeName}</h2>
    <div class="section-label">${results.length} questions found</div>
    <div class="cue-card">
      <div class="prompt">Questions categorized as ${typeName}:</div>
      <div style="margin-top:10px; font-size:0.85rem;">${rows}</div>
    </div>
  `;
  openOverlay();
}


/* ----------------------------------------------------------
   H. EVENT WIRING
   All event listeners registered here, after DOM is ready.
   Uses event delegation on #grid and #modal-content so we
   don't attach hundreds of individual listeners to each card/tag.
   ---------------------------------------------------------- */
document.addEventListener('DOMContentLoaded', () => {

  // Tab buttons
  document.getElementById('tab-part1').addEventListener('click', () => renderGrid('part1'));
  document.getElementById('tab-part2').addEventListener('click', () => renderGrid('part2'));

  // Close button inside modal
  document.getElementById('close-btn').addEventListener('click', closeOverlay);

  // Click outside modal to close
  document.getElementById('overlay').addEventListener('click', e => {
    if (e.target === document.getElementById('overlay')) closeOverlay();
  });

  // Event delegation on grid: card clicks, content tag clicks
  document.getElementById('grid').addEventListener('click', e => {
    // Content tag click (ctag) — stop propagation so card doesn't also open
    const ctag = e.target.closest('[data-content-tag]');
    if (ctag) {
      e.stopPropagation();
      openTagSummary(ctag.dataset.contentTag);
      return;
    }
    // Card click — open topic detail modal
    const card = e.target.closest('.card');
    if (card) {
      state.lastActiveTag = null;
      openModal(card.dataset.tab, parseInt(card.dataset.idx));
    }
  });

  // Event delegation on modal: content tag clicks, type tag clicks, summary item clicks
  document.getElementById('modal-content').addEventListener('click', e => {
    const ctag = e.target.closest('[data-content-tag]');
    if (ctag) { openTagSummary(ctag.dataset.contentTag); return; }

    const ttag = e.target.closest('[data-type-tag]');
    if (ttag) { openTypeSummary(ttag.dataset.typeTag); return; }

    const summaryItem = e.target.closest('[data-modal-idx]');
    if (summaryItem) {
      openModal(summaryItem.dataset.modalTab, parseInt(summaryItem.dataset.modalIdx));
    }
  });

  // Load data and render initial grid
  loadData();
});

// Opens the overlay
function openOverlay() {
  document.getElementById('overlay').classList.add('open');
}

// Closes the overlay and clears modal content
function closeOverlay() {
  document.getElementById('overlay').classList.remove('open');
}

</script>
</body>
</html>
