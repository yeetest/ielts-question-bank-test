<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>IELTS Speaking Question Bank — 2026 Jan–Apr</title>
<style>
  :root {
  /* System Colors */
  --bg-primary: #f8fafc;
  --bg-card: #ffffff;
  --text-main: #1e293b;
  --text-muted: #64748b;
  --accent: #6366f1; /* Indigo */
  
  /* Source Specific (Matching your data logic) */
  --color-tz: #3b82f6;   /* 同桌 Blue */
  --color-lk: #f59e0b;   /* 老烤鸭 Orange */
  --color-both: #10b981; /* Success Green */
  
  /* Layout */
  --radius: 12px;
  --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Inter', -apple-system, sans-serif; /* Clean sans-serif */
  background: var(--bg-primary);
  color: var(--text-main);
  padding: 40px 24px;
  line-height: 1.5;
}

/* Header & Tabs */
h1 { font-size: 1.8rem; letter-spacing: -0.025em; margin-bottom: 4px; }
.subtitle { color: var(--text-muted); margin-bottom: 32px; font-weight: 500; }

.tabs { display: flex; gap: 12px; margin-bottom: 32px; }
.tab {
  padding: 10px 24px;
  border: none;
  border-radius: var(--radius);
  cursor: pointer;
  background: #e2e8f0;
  color: var(--text-muted);
  font-weight: 600;
  transition: all 0.2s ease;
}
.tab.active { background: var(--accent); color: white; box-shadow: var(--shadow); }

/* Legend */
.legend { 
  background: white; 
  padding: 12px 20px; 
  border-radius: var(--radius);
  display: inline-flex; 
  gap: 20px; 
  margin-bottom: 24px; 
  font-size: 0.85rem;
  border: 1px solid #e2e8f0;
}
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
.dot-tz { background: var(--color-tz); }
.dot-lk { background: var(--color-lk); }
.dot-both { background: var(--color-both); }

/* Topic Grid */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 20px;
}

.card {
  background: var(--bg-card);
  border: 1px solid #e2e8f0;
  border-radius: var(--radius);
  padding: 20px;
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
}
.card:hover { 
  transform: translateY(-4px); 
  box-shadow: var(--shadow);
  border-color: var(--accent);
}

.card-title { font-size: 1.05rem; font-weight: 700; margin-bottom: 8px; color: var(--text-main); }
.card-meta { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 12px; }

/* Badges */
.badge {
  font-size: 0.7rem;
  padding: 4px 10px;
  border-radius: 6px;
  font-weight: 700;
  text-transform: uppercase;
}
.badge-tz { background: #eff6ff; color: var(--color-tz); }
.badge-lk { background: #fffbeb; color: var(--color-lk); }

/* Modal / Overlay */
.overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.6); /* Darker backdrop */
  backdrop-filter: blur(4px);
  z-index: 100;
  justify-content: center;
  padding: 60px 20px;
}
.overlay.open { display: flex; }

.modal {
  background: white;
  border-radius: 16px;
  padding: 32px;
  max-width: 680px;
  width: 100%;
  box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.25);
}
</style>
</head>
<body>

<h1>IELTS Speaking Question Bank</h1>
<div class="subtitle">2026 Jan–Apr season · <span id="total-count"></span></div>

<div class="tabs">
  <button class="tab active" onclick="switchTab('part1')">Part 1</button>
  <button class="tab" onclick="switchTab('part2')">Part 2 + Part 3</button>
</div>

<div class="legend">
  <span><span class="dot dot-tz"></span>同桌英语</span>
  <span><span class="dot dot-lk"></span>老烤鸭</span>
  <span><span class="dot dot-both"></span>Both sources</span>
</div>

<div class="grid" id="grid"></div>

<!-- Modal -->
<div class="overlay" id="overlay" onclick="closeModal(event)">
  <div class="modal" id="modal">
    <button class="close-btn" onclick="closeOverlay()">✕</button>
    <div id="modal-content"></div>
  </div>
</div>

<script>
// ── DATA ──────────────────────────────────────────────────────────────────────

let part1Data = [], part2Data = [];
let currentTab = 'part1';

// ── HELPERS ───────────────────────────────────────────────────────────────────
function renderTypeTags(tags) {
  if (!tags || !tags.length) return '';
  const badges = tags.map(t => `<span class="ttag ttag-${t}">${t}</span>`).join('');
  return `<span class="type-tags">${badges}</span>`;
}

function getSources(questions) {
  const hasTZ = questions.some(q => q.source === 'tongzhuo');
  const hasLK = questions.some(q => q.source === 'laokaoya');
  return { hasTZ, hasLK };
}

function sourceColor(hasTZ, hasLK) {
  if (hasTZ && hasLK) return '#10b981';
  if (hasTZ) return '#3b82f6';
  return '#f59e0b';
}

// ── RENDER GRID ───────────────────────────────────────────────────────────────
function renderGrid(tab) {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  const data = tab === 'part1' ? part1Data : part2Data;

  document.getElementById('total-count').textContent =
    `${data.length} topics · Part ${tab === 'part1' ? '1' : '2'}`;

  data.forEach((item, idx) => {
    const questions = item.questions || item.part3 || [];
    const { hasTZ, hasLK } = getSources(questions);
    const color = sourceColor(hasTZ, hasLK);

    const card = document.createElement('div');
    card.className = 'card';
    card.onclick = () => openModal(tab, idx);

    let title;
    if (tab === 'part1') {
      title = item.topic_en;
    } else {
      const raw = (item.cue_card?.prompt || item.topic || '')
        .replace(/[\u200b\u200c\u200d\ufeff]/g, '')  // strip zero-width chars
        .replace(/\s*You should say.*/is, '')         // cut at "You should say"
        .replace(/^\s*Describe\s+/i, '')              // remove leading "Describe"
        .trim();
      title = raw.length > 80 ? raw.slice(0, 79) + '…' : raw;
    }
    const qCount = questions.length;

    const ct = item.content_tags || [];
    const ctBadges = tab === 'part2' && ct.length ? `
      <div class="source-bar" style="margin-top:6px;flex-wrap:wrap;gap:4px;">
        ${ct.map((tag, i) => {
          const cls = i === 0
            ? `ctag-${tag.replace('/', '-')}`
            : 'ctag-tag';
          return `<span class="ctag ${cls}">${tag}</span>`;
        }).join('')}
      </div>` : '';

    card.innerHTML = `
      <div class="card-title">${title}</div>
      <div class="card-meta">${qCount} question${qCount !== 1 ? 's' : ''}</div>
      <div class="source-bar">
        ${hasTZ ? '<span class="badge badge-tz">同桌</span>' : ''}
        ${hasLK ? '<span class="badge badge-lk">老烤鸭</span>' : ''}
        ${item.source === 'laokaoya_unmatched' ? '<span class="badge badge-unmatched">老烤鸭 only</span>' : ''}
      </div>
      ${ctBadges}
    `;
    grid.appendChild(card);
  });
}

// ── MODAL ─────────────────────────────────────────────────────────────────────
function openModal(tab, idx) {
  const item = tab === 'part1' ? part1Data[idx] : part2Data[idx];
  const content = document.getElementById('modal-content');

  if (tab === 'part1') {
    const tzQs = item.questions.filter(q => q.source === 'tongzhuo');
    const lkQs = item.questions.filter(q => q.source === 'laokaoya');

    content.innerHTML = `
      <h2>${item.topic_en}</h2>
      <div class="season">${item.season} · Part 1</div>
      ${tzQs.length ? `
        <div class="section-label">同桌英语</div>
        ${tzQs.map(q => `
          <div class="q-row">
            <span class="q-dot tz"></span>
            <span>${q.text}</span>
          </div>`).join('')}` : ''}
      ${lkQs.length ? `
        <div class="section-label">老烤鸭</div>
        ${lkQs.map(q => `
          <div class="q-row">
            <span class="q-dot lk"></span>
            <span>${q.text}</span>
          </div>`).join('')}` : ''}
    `;
  } else {
    const cc = item.cue_card || {};
    const p3 = item.part3 || [];
    const tzQs = p3.filter(q => q.source === 'tongzhuo');
    const lkQs = p3.filter(q => q.source === 'laokaoya');

    const ccPrompt = (cc.prompt || '')
      .replace(/[\u200b\u200c\u200d\ufeff]/g, '')
      .replace(/\s*You should say.*/is, '')
      .trim();
    const ccBullets = (cc.you_should_say || [])
      .map(s => s.replace(/[\u200b\u200c\u200d\ufeff]/g, '').trim())
      .filter(s => s && !/^you should say/i.test(s));

    content.innerHTML = `
      <h2>${item.topic || item.topic_en || ''}</h2>
      <div class="season">${item.season} · Part 2 + 3</div>
      <div class="section-label">Cue Card</div>
      <div class="cue-card">
        <div class="prompt">${ccPrompt}</div>
        <div class="section-label" style="margin-top:10px">You should say:</div>
        <ul>${ccBullets.map(s => `<li>${s}</li>`).join('')}</ul>
      </div>
      ${tzQs.length ? `
        <div class="section-label">Part 3 — 同桌英语</div>
        ${tzQs.map(q => `
          <div class="q-row">
            <span class="q-dot tz"></span>
            <span>${q.text}${renderTypeTags(q.type_tags)}</span>
          </div>`).join('')}` : ''}
      ${lkQs.length ? `
        <div class="section-label">Part 3 — 老烤鸭</div>
        ${lkQs.map(q => `
          <div class="q-row">
            <span class="q-dot lk"></span>
            <span>${q.text}${renderTypeTags(q.type_tags)}</span>
          </div>`).join('')}` : ''}
    `;
  }

  document.getElementById('overlay').classList.add('open');
}

function closeOverlay() {
  document.getElementById('overlay').classList.remove('open');
}
function closeModal(e) {
  if (e.target === document.getElementById('overlay')) closeOverlay();
}

// ── TABS ──────────────────────────────────────────────────────────────────────
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach((t, i) => {
    t.classList.toggle('active', (i === 0 && tab === 'part1') || (i === 1 && tab === 'part2'));
  });
  renderGrid(tab);
}

// ── INIT ──────────────────────────────────────────────────────────────────────
(async () => {
  [part1Data, part2Data] = await Promise.all([
    fetch('merged_part1.json').then(r => r.json()),
    fetch('merged_part2.json').then(r => r.json()),
  ]);
  renderGrid('part1');
})();
</script>
</body>
</html>
