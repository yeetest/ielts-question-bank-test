<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>IELTS Speaking Question Bank — 2026 Jan–Apr</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Georgia', serif;
    background: #f7f5f0;
    color: #222;
    padding: 24px;
  }
  h1 {
    font-size: 1.4rem;
    font-weight: bold;
    margin-bottom: 6px;
  }
  .subtitle {
    color: #888;
    font-size: 0.85rem;
    margin-bottom: 20px;
  }
  /* Tab buttons */
  .tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
  }
  .tab {
    padding: 8px 20px;
    border: 1.5px solid #ccc;
    border-radius: 4px;
    cursor: pointer;
    background: #fff;
    font-size: 0.9rem;
  }
  .tab.active {
    background: #222;
    color: #fff;
    border-color: #222;
  }

  /* Legend */
  .legend {
    display: flex;
    gap: 16px;
    margin-bottom: 16px;
    font-size: 0.8rem;
    align-items: center;
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 4px; }
  .dot-tz { background: #3b82f6; }
  .dot-lk { background: #f59e0b; }
  .dot-both { background: #10b981; }

  /* Topic grid */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 14px;
  }
  .card {
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 6px;
    padding: 14px;
    cursor: pointer;
    transition: box-shadow 0.15s;
  }
  .card:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
  .card-title {
    font-size: 0.95rem;
    font-weight: bold;
    margin-bottom: 6px;
  }
  .card-meta {
    font-size: 0.75rem;
    color: #888;
  }
  .source-bar {
    display: flex;
    gap: 4px;
    margin-top: 8px;
  }
  .badge {
    font-size: 0.7rem;
    padding: 2px 7px;
    border-radius: 10px;
    font-weight: bold;
  }
  .badge-tz { background: #dbeafe; color: #1d4ed8; }
  .badge-lk { background: #fef3c7; color: #b45309; }
  .badge-unmatched { background: #f3f4f6; color: #6b7280; }

  /* Modal overlay */
  .overlay {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.4);
    z-index: 100;
    justify-content: center;
    align-items: flex-start;
    padding: 40px 16px;
    overflow-y: auto;
  }
  .overlay.open { display: flex; }
  .modal {
    background: #fff;
    border-radius: 8px;
    padding: 28px;
    max-width: 620px;
    width: 100%;
    position: relative;
  }
  .modal h2 {
    font-size: 1.2rem;
    margin-bottom: 4px;
  }
  .modal .season {
    font-size: 0.78rem;
    color: #999;
    margin-bottom: 16px;
  }
  .close-btn {
    position: absolute;
    top: 14px; right: 16px;
    font-size: 1.2rem;
    cursor: pointer;
    background: none;
    border: none;
    color: #555;
  }
  .section-label {
    font-size: 0.78rem;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #999;
    margin: 14px 0 6px;
  }
  .q-row {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    padding: 5px 0;
    border-bottom: 1px solid #f0f0f0;
    font-size: 0.88rem;
    line-height: 1.5;
  }
  .q-row:last-child { border-bottom: none; }
  .q-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
    margin-top: 6px;
  }
  .q-dot.tz { background: #3b82f6; }
  .q-dot.lk { background: #f59e0b; }

  /* Part 2 cue card */
  .cue-card {
    background: #f9fafb;
    border-left: 3px solid #6366f1;
    padding: 12px 14px;
    border-radius: 4px;
    font-size: 0.88rem;
    line-height: 1.6;
    margin-bottom: 6px;
  }
  .cue-card .prompt { font-weight: bold; margin-bottom: 8px; }
  .cue-card ul { padding-left: 16px; }
  .cue-card li { margin-bottom: 2px; }
</style>
</head>
<body>

<h1>IELTS Speaking Question Bank</h1>
<div class="subtitle">2026 Jan–Apr season · <span id="total-count"></span></div>

<div class="tabs">
  <button class="tab active" onclick="switchTab('part1')">Part 1</button>
  <button class="tab" onclick="switchTab('part2')">Part 2 + Part 3</button>
</div>

<div class="legend">
  <span><span class="dot dot-tz"></span>同桌英语</span>
  <span><span class="dot dot-lk"></span>老烤鸭</span>
  <span><span class="dot dot-both"></span>Both sources</span>
</div>

<div class="grid" id="grid"></div>

<!-- Modal -->
<div class="overlay" id="overlay" onclick="closeModal(event)">
  <div class="modal" id="modal">
    <button class="close-btn" onclick="closeOverlay()">✕</button>
    <div id="modal-content"></div>
  </div>
</div>

<script>
// ── DATA ──────────────────────────────────────────────────────────────────────

let part1Data = [], part2Data = [];
let currentTab = 'part1';

// ── HELPERS ───────────────────────────────────────────────────────────────────
function getSources(questions) {
  const hasTZ = questions.some(q => q.source === 'tongzhuo');
  const hasLK = questions.some(q => q.source === 'laokaoya');
  return { hasTZ, hasLK };
}

function sourceColor(hasTZ, hasLK) {
  if (hasTZ && hasLK) return '#10b981';
  if (hasTZ) return '#3b82f6';
  return '#f59e0b';
}

// ── RENDER GRID ───────────────────────────────────────────────────────────────
function renderGrid(tab) {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  const data = tab === 'part1' ? part1Data : part2Data;

  document.getElementById('total-count').textContent =
    `${data.length} topics · Part ${tab === 'part1' ? '1' : '2'}`;

  data.forEach((item, idx) => {
    const questions = item.questions || item.part3 || [];
    const { hasTZ, hasLK } = getSources(questions);
    const color = sourceColor(hasTZ, hasLK);

    const card = document.createElement('div');
    card.className = 'card';
    card.onclick = () => openModal(tab, idx);

    let title;
    if (tab === 'part1') {
      title = item.topic_en;
    } else {
      const raw = (item.cue_card?.prompt || item.topic || '')
        .replace(/[\u200b\u200c\u200d\ufeff]/g, '')  // strip zero-width chars
        .replace(/\s*You should say.*/is, '')         // cut at "You should say"
        .replace(/^\s*Describe\s+/i, '')              // remove leading "Describe"
        .trim();
      title = raw.length > 80 ? raw.slice(0, 79) + '…' : raw;
    }
    const qCount = questions.length;

    card.innerHTML = `
      <div class="card-title">${title}</div>
      <div class="card-meta">${qCount} question${qCount !== 1 ? 's' : ''}</div>
      <div class="source-bar">
        ${hasTZ ? '<span class="badge badge-tz">同桌</span>' : ''}
        ${hasLK ? '<span class="badge badge-lk">老烤鸭</span>' : ''}
        ${item.source === 'laokaoya_unmatched' ? '<span class="badge badge-unmatched">老烤鸭 only</span>' : ''}
      </div>
    `;
    grid.appendChild(card);
  });
}

// ── MODAL ─────────────────────────────────────────────────────────────────────
function openModal(tab, idx) {
  const item = tab === 'part1' ? part1Data[idx] : part2Data[idx];
  const content = document.getElementById('modal-content');

  if (tab === 'part1') {
    const tzQs = item.questions.filter(q => q.source === 'tongzhuo');
    const lkQs = item.questions.filter(q => q.source === 'laokaoya');

    content.innerHTML = `
      <h2>${item.topic_en}</h2>
      <div class="season">${item.season} · Part 1</div>
      ${tzQs.length ? `
        <div class="section-label">同桌英语</div>
        ${tzQs.map(q => `
          <div class="q-row">
            <span class="q-dot tz"></span>
            <span>${q.text}</span>
          </div>`).join('')}` : ''}
      ${lkQs.length ? `
        <div class="section-label">老烤鸭</div>
        ${lkQs.map(q => `
          <div class="q-row">
            <span class="q-dot lk"></span>
            <span>${q.text}</span>
          </div>`).join('')}` : ''}
    `;
  } else {
    const cc = item.cue_card || {};
    const p3 = item.part3 || [];
    const tzQs = p3.filter(q => q.source === 'tongzhuo');
    const lkQs = p3.filter(q => q.source === 'laokaoya');

    const ccPrompt = (cc.prompt || '')
      .replace(/[\u200b\u200c\u200d\ufeff]/g, '')
      .replace(/\s*You should say.*/is, '')
      .trim();
    console.log('you_should_say raw:', cc.you_should_say);
    const ccBullets = (cc.you_should_say || [])
      .map(s => s.replace(/[\u200b\u200c\u200d\ufeff]/g, '').trim())
      .filter(s => s && !/^you should say/i.test(s));
    console.log('ccBullets after filter:', ccBullets);

    content.innerHTML = `
      <h2>${item.topic || item.topic_en || ''}</h2>
      <div class="season">${item.season} · Part 2 + 3</div>
      <div class="section-label">Cue Card</div>
      <div class="cue-card">
        <div class="prompt">${ccPrompt}</div>
        <div class="section-label" style="margin-top:10px">You should say:</div>
        <ul>${ccBullets.map(s => `<li>${s}</li>`).join('')}</ul>
      </div>
      ${tzQs.length ? `
        <div class="section-label">Part 3 — 同桌英语</div>
        ${tzQs.map(q => `
          <div class="q-row">
            <span class="q-dot tz"></span>
            <span>${q.text}</span>
          </div>`).join('')}` : ''}
      ${lkQs.length ? `
        <div class="section-label">Part 3 — 老烤鸭</div>
        ${lkQs.map(q => `
          <div class="q-row">
            <span class="q-dot lk"></span>
            <span>${q.text}</span>
          </div>`).join('')}` : ''}
    `;
  }

  document.getElementById('overlay').classList.add('open');
}

function closeOverlay() {
  document.getElementById('overlay').classList.remove('open');
}
function closeModal(e) {
  if (e.target === document.getElementById('overlay')) closeOverlay();
}

// ── TABS ──────────────────────────────────────────────────────────────────────
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach((t, i) => {
    t.classList.toggle('active', (i === 0 && tab === 'part1') || (i === 1 && tab === 'part2'));
  });
  renderGrid(tab);
}

// ── INIT ──────────────────────────────────────────────────────────────────────
(async () => {
  [part1Data, part2Data] = await Promise.all([
    fetch('merged_part1.json').then(r => r.json()),
    fetch('merged_part2.json').then(r => r.json()),
  ]);
  renderGrid('part1');
})();
</script>
</body>
</html>
